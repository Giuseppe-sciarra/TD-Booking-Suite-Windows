name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache dei download
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('windows/build.ps1') }}

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -r windows/requirements-test.txt
          python -m pytest -q

      - name: MSI
        run: pwsh windows/build.ps1

      - name: Prova di installazione
        run: pwsh windows/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TD-Booking-Suite-Windows
          path: dist/*.msi
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TD-Booking-Suite-Windows
      - name: Rilascio con l'MSI allegato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" *.msi --repo "${GITHUB_REPOSITORY}" \
            --title "TD Booking Suite per Windows ${GITHUB_REF_NAME}" \
            --notes "MSI per server e postazioni. Windows lo segnala come app non riconosciuta perché non è firmato: Ulteriori informazioni, poi Esegui comunque."
