name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rilascio:
        description: "Pubblica il rilascio: MSI, README e screenshot anche nella vetrina pubblica"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.msi.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache dei download
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('windows/build.ps1') }}

      # the runner's own PostgreSQL, so the end-to-end test (setup, pg_dump, HTTPS, restore) runs too
      - name: PostgreSQL per i test
        run: |
          $service = Get-Service "postgresql*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $service) { Write-Host "::notice::PostgreSQL non presente sul runner: il test con il database vero viene saltato"; exit 0 }
          Set-Service $service.Name -StartupType Manual
          Start-Service $service.Name
          "TDWIN_PG_ADMIN=postgresql://postgres:root@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
          "$env:PGBIN" >> $env:GITHUB_PATH

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -r windows/requirements-test.txt
          python -m pytest -q

      - name: MSI
        id: msi
        env:
          TDBS_RILASCIO: ${{ inputs.rilascio }}
        run: |
          pwsh windows/build.ps1
          "version=$((Get-Content suite/VERSION).Trim())" >> $env:GITHUB_OUTPUT

      - name: Prova di installazione
        run: pwsh windows/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TD-Booking-Suite-Windows
          path: dist/*.msi
          retention-days: 30

  licenze:
    # TD Licenze.exe, the seller's window to make licences: never inside the customers' MSI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: TD Licenze.exe
        env:
          TD_LICENZE_CHIAVE: ${{ secrets.TD_LICENZE_CHIAVE }}
          TD_LICENZE_REGISTRO: ${{ secrets.TD_LICENZE_REGISTRO }}
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6.11,<7" cryptography
          # the seller's key, encrypted with its password, inside the exe: TD Licenze works on any PC with the password
          python licenze/incorpora_chiave.py
          python -m PyInstaller --noconfirm --windowed --name "TD Licenze" --icon windows/client/app.ico --add-data "windows/client/app.ico;." --paths licenze --hidden-import chiave_incorporata --distpath dist-licenze --workpath build/pyinstaller licenze/td_licenze_gui.py
          $p = Start-Process "dist-licenze/TD Licenze/TD Licenze.exe" -ArgumentList "--prova" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "TD Licenze.exe non parte, codice $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: TD-Licenze
          path: dist-licenze/TD Licenze
          retention-days: 90

  release:
    # a tag v2.8.0, or Actions > Windows > Run workflow with "Pubblica il rilascio"
    if: startsWith(github.ref, 'refs/tags/v') || inputs.rilascio
    needs: msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.msi.outputs.version) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TD-Booking-Suite-Windows
          path: dist

      - name: Rilascio con l'MSI allegato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.msi --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.msi --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "TD Booking Suite per Windows $TAG" \
              --notes "MSI per server e postazioni. Windows lo segnala come app non riconosciuta perché non è firmato: Ulteriori informazioni, poi Esegui comunque."
          fi

      # the public showcase: README, screenshots and the MSI, never the code
      - name: Vetrina pubblica
        env:
          GH_TOKEN: ${{ secrets.VETRINA_TOKEN }}
          VETRINA: ${{ vars.VETRINA_REPO || 'Giuseppe-sciarra/TD-Booking-Suite-per-Windows' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::Manca il secret VETRINA_TOKEN: vetrina non aggiornata"; exit 0; fi
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${VETRINA}.git" vetrina-repo
          mkdir -p vetrina-repo/screenshots
          cp vetrina/README.md vetrina-repo/README.md
          cp docs/screenshots/*.png vetrina-repo/screenshots/
          # the customers' instructions; the TD Licenze one is internal and never leaves this repo
          cp docs/Istruzioni-TD-Booking-Suite-Windows.pdf vetrina-repo/
          cd vetrina-repo
          git checkout -q -B main
          git config user.name "TD Booking Suite"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "TD Booking Suite per Windows $TAG"
          git push -q origin main
          if gh release view "$TAG" --repo "$VETRINA" >/dev/null 2>&1; then
            gh release upload "$TAG" ../dist/*.msi Istruzioni-TD-Booking-Suite-Windows.pdf --repo "$VETRINA" --clobber
          else
            gh release create "$TAG" ../dist/*.msi Istruzioni-TD-Booking-Suite-Windows.pdf --repo "$VETRINA" --target main \
              --title "TD Booking Suite per Windows $TAG" \
              --notes "Un solo MSI per Un PC solo, per il server e per le postazioni: la scelta si fa durante l'installazione. 7 giorni di prova. Windows lo segnala perché non è ancora firmato: Ulteriori informazioni, poi Esegui comunque. Le istruzioni sono nel PDF allegato."
          fi
