name: net (programma in C#)
# The C# rewrite on its own branch: build on Windows, the tests, and the windows on recorded answers as screenshots.
# Only by hand (Actions → Run workflow, or gh workflow run net.yml --ref net-rewrite): not at every push.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Compila
        run: dotnet build net/TDBooking.sln -c Release
      - name: Prove
        run: dotnet test net/tests/TD.Tests -c Release --no-build
      - name: Finestre (screenshot)
        shell: pwsh
        run: |
          $exe = "net/src/TD.App/bin/Release/net8.0-windows/TDBookingSuite.exe"
          $p = Start-Process $exe -ArgumentList "--demo", "$PWD/net/tests/demo", "--shot", "$PWD/shots" -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "le finestre non si sono chiuse" }
          "uscita: $($p.ExitCode)"; Get-Content err.txt, out.txt -ErrorAction SilentlyContinue
          $log = Join-Path $env:TEMP "TDBookingSuite-errore.txt"
          if (Test-Path $log) { Get-Content $log; New-Item -ItemType Directory -Force shots | Out-Null; Copy-Item $log shots/ }
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshot, path: shots }
